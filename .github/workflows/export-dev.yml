name: Export Baseline PFDO Data from DEV

on:
  workflow_dispatch:

jobs:
  export-solution:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Who Am I
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ vars.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.POWERPLATFORM_CLIENT_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}

      - name: Export unmanaged solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ vars.DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.POWERPLATFORM_CLIENT_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}
          solution-name: ${{ vars.SOLUTION_NAME }}
          solution-output-file: out/${{ vars.SOLUTION_NAME }}.zip
          managed: false

      - name: Unpack solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ vars.SOLUTION_NAME }}.zip
          solution-folder: solutions/${{ vars.SOLUTION_NAME }}
          solution-type: Unmanaged
          overwrite-files: true

      - name: Upload unmanaged solution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.SOLUTION_NAME }}-unmanaged
          path: out/${{ vars.SOLUTION_NAME }}.zip
          if-no-files-found: error